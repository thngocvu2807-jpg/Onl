<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Cloud Browser ⚡</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.8);
            --accent: #38bdf8;
            --danger: #f43f5e;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0; padding: 0; height: 100vh;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* Thanh điều hướng */
        #browser-bar {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
        }

        .nav-btn {
            background: transparent; border: none; color: var(--text-main);
            font-size: 18px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 8px;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.1); color: var(--accent); }

        .url-container {
            flex: 1; display: flex; align-items: center;
            background: #0b1120; border: 1px solid #334155;
            border-radius: 20px; padding: 5px 15px;
            transition: 0.3s;
        }
        .url-container:focus-within { border-color: var(--accent); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

        #url-input {
            flex: 1; background: transparent; border: none; color: white;
            font-size: 15px; padding: 8px 5px; outline: none; width: 100%;
        }

        .go-btn {
            background: var(--accent); color: #000; border: none;
            padding: 8px 20px; border-radius: 15px; font-weight: bold;
            cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        .go-btn:hover { background: #0ea5e9; transform: scale(1.05); }

        /* Khung hiển thị web */
        #webview-container { flex: 1; position: relative; background: #fff;}
        #view-frame { width: 100%; height: 100%; border: none; display: block; }

        /* Màn hình Loading Đẹp mắt */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px);
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 50; transition: 0.3s;
        }

        .spinner {
            width: 50px; height: 50px;
            border: 5px solid rgba(56, 189, 248, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #loading-text { color: var(--accent); font-weight: bold; font-size: 16px; letter-spacing: 1px; }

        /* Thanh thông báo nổi */
        #toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--success); color: #000; padding: 10px 25px;
            border-radius: 30px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999;
        }
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="browser-bar">
        <button class="nav-btn" onclick="document.getElementById('view-frame').srcdoc = `<h3 style='text-align:center; color:#555; margin-top:50px;'>Trang chủ Đám mây</h3>`; document.getElementById('url-input').value = '';" title="Trang chủ"><i class="fas fa-home"></i></button>
        <button class="nav-btn" onclick="load()" title="Tải lại"><i class="fas fa-redo-alt"></i></button>
        
        <div class="url-container">
            <i class="fas fa-lock" style="color: #10b981; margin-right: 10px; font-size: 12px;"></i>
            <input type="text" id="url-input" placeholder="Nhập địa chỉ web (VD: sangtacviet.app)..." onkeypress="if(event.key === 'Enter') load()">
        </div>
        
        <button class="go-btn" onclick="load()"><i class="fas fa-bolt"></i> CHẠY</button>
    </div>

    <div id="webview-container">
        <!-- Lớp phủ Loading -->
        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="loading-text">Đang kết nối Máy chủ...</div>
        </div>

        <iframe id="view-frame" srcdoc="<div style='display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; color:#64748b; background:#f8fafc;'><div style='text-align:center;'><i class='fas fa-cloud' style='font-size:60px; color:#cbd5e1; margin-bottom:20px;'></i><h2>Sẵn sàng duyệt web</h2><p>Dán link lên thanh địa chỉ để bắt đầu</p></div></div>"></iframe>
    </div>

    <div id="toast">Thông báo</div>

    <script>
        const socket = io();
        const frame = document.getElementById('view-frame');
        const overlay = document.getElementById('loading-overlay');
        const loadingText = document.getElementById('loading-text');
        const toastEl = document.getElementById('toast');
        let currentUrl = "";
        
        function showToast(msg, isError = false) { 
            toastEl.innerText = msg; 
            toastEl.style.background = isError ? "var(--danger)" : "var(--success)";
            toastEl.style.color = isError ? "#fff" : "#000";
            toastEl.classList.add('show'); 
            setTimeout(() => toastEl.classList.remove('show'), 3000); 
        }

        function setLoading(isActive, msg = "Đang xử lý...") {
            loadingText.innerText = msg;
            overlay.style.display = isActive ? "flex" : "none";
        }

        function load() { 
            let u = document.getElementById('url-input').value.trim(); 
            if(!u) return;
            if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
            document.getElementById('url-input').value = u;
            currentUrl = u;

            setLoading(true, "Đang tải trang web...");
            socket.emit('goto_url', u); 
        }
        
        // Nhận trạng thái từ server
        socket.on('status', m => { setLoading(true, m); });
        
        // Nhận mã HTML từ server
        socket.on('render_page', d => { 
            document.title = "☁️ " + d.title; 
            if(d.url) {
                document.getElementById('url-input').value = d.url;
                currentUrl = d.url;
            }
            
            // Xóa sạch iframe và dán HTML mới
            const doc = frame.contentWindow.document;
            doc.open(); doc.write(d.html); doc.close();
            
            setLoading(false);
            showToast('Tải hoàn tất!');
            bindIframeEvents(); 
        });

        // Hàm lấy bộ định vị chính xác của phần tử bị click
        function getSel(el){
            if(!el || el.nodeType!==1) return null; if(el.id) return '#'+el.id;
            let path=[]; while(el && el.nodeType===1){
                let sel=el.nodeName.toLowerCase(); if(el.id){ sel+='#'+el.id; path.unshift(sel); break; }
                let sib=el, c=1; while(sib=sib.previousElementSibling) if(sib.nodeName.toLowerCase()===el.nodeName.toLowerCase()) c++;
                sel+=`:nth-of-type(${c})`; path.unshift(sel); el=el.parentNode;
            } return path.join(' > ');
        }

        // Bắt sự kiện click trong Iframe
        function bindIframeEvents() {
            const doc = frame.contentWindow.document;
            doc.addEventListener('click', e => { 
                let targetEl = e.target.closest('a, button, div.chapter, span'); // Chỉ bắt các nút có ý nghĩa
                if(!targetEl) return;

                e.preventDefault(); e.stopPropagation(); 
                const sel = getSel(targetEl); 
                
                if(sel){ 
                    setLoading(true, "Đang click vào hệ thống..."); 
                    socket.emit('user_click', sel); 
                }
            }, true);
        }
    </script>
</body>
</html>
